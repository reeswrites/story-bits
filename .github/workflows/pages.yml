# Deploys the site to GitHub Pages. Before publishing it runs the same checks as test.yml, then
# stamps every local script and stylesheet link in index.html with the commit (?v=<sha>). Browsers
# cache files for a while; with the stamp, a page always asks for the files it was deployed with,
# so a deploy never mixes old and new scripts. Local development is unchanged: index.html in the
# repo keeps plain links, and only the deployed copy is stamped.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check every script
        run: git ls-files '*.js' '*.mjs' | xargs -n1 node --check

      - name: Engine tests
        run: node --test test/*.test.mjs

      - name: Assemble the site and stamp asset links
        run: |
          mkdir _site
          git ls-files | grep -vE '^(\.github|party|test|tools)/' | xargs -I{} cp --parents {} _site/
          v="${GITHUB_SHA::12}"
          sed -E -i "s#(src|href)=\"([a-z0-9/-]+\.(js|css))\"#\1=\"\2?v=${v}\"#g" _site/index.html
          echo "Stamped with ${v}:"
          grep -oE '(src|href)="[a-z0-9/-]+\.(js|css)\?v=[0-9a-f]+"' _site/index.html
          # Every local script and stylesheet must be stamped, or a deploy could mix versions.
          if grep -qE '(src|href)="[a-z0-9/-]+\.(js|css)"' _site/index.html; then echo "unstamped asset link left"; exit 1; fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
